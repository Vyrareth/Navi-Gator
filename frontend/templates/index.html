<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Navi-Gator</title>
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
    #map {
    height: 450px;
    width: 100%;
    margin-top: 20px;
    border: 2px solid #333;
    border-radius: 8px;
    }
    </style>
</head>
<body>

    <h1>Welcome to Navi-Gator!</h1>
    
    <h2>Plan Your Trip</h2>
    <!-- Starting Location -->
     <label for="start">Starting Location:</label>
     <input
        type="text"
            id="start"
            name="start"
            placeholder="Enter starting address"
    >
    <br><br>
    
    <!-- Destination -->
     <label for="end">Destination:</label>
     <input
        type="text"
            id="end"
            name="end"
            placeholder="Enter destination address"
    >
    <br><br>
    
    <!-- Plan Trip Button -->
     <button type="button" id="planRoute">
        Plan Trip
    </button>
    
    <!-- Route Result -->
     <p id="routeResult"></p>
     <br>

     <div id="map"></div>
     
     <h2>Available Locations</h2>
     <ul>
        {% for location in locations %}
        <li>
            {{ location['Road_Name'] }}
        </li>
        {% endfor %}
    </ul>
    
    <!-- JavaScript -->
     <script>
        // Cooridinates for our locations
        const locationCooridinates = {};
        {% for location in locations %}
        locationCooridinates["{{ location['id'] }}"] = [
            {{ location['latitude'] }},
            {{ location['longitude'] }}
        ];
        {% endfor %}

    async function getCoordinates(address){
        const url = "https://nominatim.openstreetmap.org/search?" + 
            new URLSearchParams({
                q: address,
                format: "json",
                limit: 1
            });
        
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error("Address lookup failed");
        }

        const data = await response.json();
        if (data.length === 0) {
            throw new Error("Address not found");
        }

        return [
            parseFloat(data[0].lat),
            parseFloat(data[0].lon)
        ];
    }

    async function getDrivingRoute(startCoords, endCoords) {
        
        const url = "https://router.project-osrm.org/route/v1/driving/" +
            startCoords[1] + "," + startCoords[0] + ";" +
            endCoords[1] + "," + endCoords[0] +
            "?overview=full&geometries=geojson&alternatives=3&steps=true";

        const response = await fetch(url);

        if (!response.ok) {
            throw new Error("Routing service unavailable");
        }

        const data = await response.json();

        console.log("Number of routes returned:", data.routes.length);

        console.log("OSRM response:", data.routes.length, "routes");

        if (data.code !== "Ok" || data.routes.length === 0) {
            throw new Error("No route found");
        }

        const routes = data.routes.slice(0, 3);

        if (routes.length < 3) {
            console.log("Fewer than 3 routes returned. A fallback route is needed.");

            const midLat = (startCoords[0] + endCoords[0]) / 2;
            const midLon = (startCoords[1] + endCoords[1]) / 2;

            const latDiff = endCoords[0] - startCoords[0];
            const lonDiff = endCoords[1] - startCoords[1];

            const waypointLat = midLat - lonDiff * 0.2;
            const waypointLon = midLon + latDiff * 0.2;

            console.log("Waypoint:", waypointLat, waypointLon);

            const waypointUrl = 
                "https://router.project-osrm.org/route/v1/driving/" + 
                startCoords[1] + "," + startCoords[0] + ";" +
                waypointLon + "," + waypointLat + ";" +
                endCoords[1] + "," + endCoords[0] +
                "?overview=full&geometries=geojson&alternatives=1&steps=true";

            console.log("Waypoint route URL:", waypointUrl);

            const waypointResponse = await fetch(waypointUrl);
            const waypointData = await waypointResponse.json();

            console.log("Waypoint route response:", waypointData.code);
            console.log("Waypoint route routes:", waypointData.routes?.length ?? 0);

            if (waypointData.code === "Ok" && waypointData.routes.length > 0) {
                const thirdRoute = waypointData.routes[0];

                console.log("Third route distance:", thirdRoute.distance / 1609.34, "miles");
                console.log("Third route duration:", thirdRoute.duration / 60, "minutes");

                const firstRoute = routes[0];

                console.log(
                    "Route 1 points:", 
                    firstRoute.geometry.coordinates.length,
                ); 

                console.log(
                    "Route 3 points:", 
                    thirdRoute.geometry.coordinates.length
                ); 
                
                routes.push(thirdRoute);
                console.log("Total routes ater fallback:", routes.length);
            } 

        return routes;
    }
    }

     document.getElementById("planRoute").addEventListener("click", async function() {
        const start = document.getElementById("start");
        const end = document.getElementById("end");
        
        const startName = start.value.trim();
        const endName = end.value.trim();
        
        const result = document.getElementById("routeResult");
        if (startName === "" || endName === "") {
            result.textContent = "Please enter both addresses.";
        } else if (startName.toLowerCase() === endName.toLowerCase()) {
            result.textContent = "Please enter two different addresses.";
        } else {
            try {
                result.textContent = "Searching for addresses...";
            const startCoords = await getCoordinates(startName);
            const endCoords = await getCoordinates(endName);

            const routes = await getDrivingRoute(startCoords, endCoords);

            console.log("Number of routes returned:", routes.length);
            
            let routeSummary = "Route from " + startName + " to " + endName + ":\n\n";

            routes.forEach((route, index) => {
                const miles = route.distance / 1609.344;
                const minutes = Math.round(route.duration / 60);
                const colors = ["blue", "green", "red"];

                routeSummary += 
                "Route " + (index + 1) + " (" + colors[index % colors.length] + "): " +
                miles.toFixed(2) + " miles | " + 
                minutes + " minutes.\n";
            });

            result.textContent = routeSummary;
            result.style.whiteSpace = "pre-line";

            routeLines.forEach(line => map.removeLayer(line));
            routeLines = [];

            const routeColors = ["blue", "green", "red"];

            routes.forEach((route, index) => {
                const roadCoords = route.geometry.coordinates.map(
                    coord => [coord[1], coord[0]]
                );

                const line = L.polyline(roadCoords, {
                    color: routeColors[index % routeColors.length],
                    weight: index === 2 ? 3 : 5,
                    opacity: index === 2 ? 0.6 : 0.9,
                    dashArray: index === 2 ? "8, 8" : null
                }).addTo(map);

                routeLines.push(line);
            });

            if (routeLines.length > 0) {
                const routeGroup = L.featureGroup(routeLines);

                map.fitBounds(routeGroup.getBounds(), {
                    padding: [50, 50]
                });
            } 

        }catch (error) {
            console.error(error);
        }
    }
}); 
    
    // Initialize the map
    const map = L.map('map').setView([39.83, -74.98], 11); 

    // Add the map tiles
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let routeLines = [];
    </script>
</body>
</html>
