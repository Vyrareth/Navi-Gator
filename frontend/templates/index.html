<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Navi-Gator</title>
    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
    #map {
    height: 450px;
    width: 100%;
    margin-top: 20px;
    border: 2px solid #333;
    border-radius: 8px;
    }
    </style>
</head>
<body>

    <h1>Welcome to Navi-Gator!</h1>
    
    <h2>Plan Your Trip</h2>
    <!-- Starting Location -->
     <label for="start">Starting Location:</label>
     <select id="start" name="start">
        {% for location in locations %}
        <option value="{{ location.id }}">
            {{ location.name }}
        </option>
        {% endfor %}
    </select>
    <br><br>
    
    <!-- Destination -->
     <label for="end">Destination:</label>
     <select id="end" name="end">
        {% for location in locations %}
        <option value="{{ location.id }}">
            {{ location.name }}
        </option>
        {% endfor %}
    </select>
    <br><br>
    
    <!-- Plan Trip Button -->
     <button type="button" id="planRoute">
        Plan Trip
    </button>
    
    <!-- Route Result -->
     <p id="routeResult"></p>
     <br>

     <div id="map"></div>
     
     <h2>Available Locations</h2>
     <ul>
        {% for location in locations %}
        <li>
            {{ location.name }}
            ({{ location.latitude }}, {{ location.longitude }})
        </li>
        {% endfor %}
    </ul>
    
    <!-- JavaScript -->
     <script>
        // Cooridinates for our locations
        const locationCooridinates = {};
        {% for location in locations %}
        locationCooridinates["{{ location['id'] }}"] = [
            {{ location['latitude'] }},
            {{ location['longitude'] }}
        ];
        {% endfor %}

     document.getElementById("planRoute").addEventListener("click", function() {
        const start = document.getElementById("start");
        const end = document.getElementById("end");
        
        const startName = start.options[start.selectedIndex].text.trim();
        const endName = end.options[end.selectedIndex].text.trim();
        
        const result = document.getElementById("routeResult");
        if (start.value === end.value) {
            result.textContent = "Please select two different locations.";
        } else {
            result.textContent = "Planning route from " + startName + " to " + endName + "...";
            
            const startCoords = locationCooridinates[start.value];
            const endCoords = locationCooridinates[end.value];
            
            map.fitBounds([startCoords, endCoords], { 
                padding: [50, 50] 
            });
    }
    });
    
    // Initialize the map
    const map = L.map('map').setView([39.9526, -75.1652], 11); 

    // Add the map tiles
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Create markers using locations from SQLite
    {% for location in locations %}
    L.marker([
        {{ location.latitude }},
        {{ location.longitude }}
    ])
    .addTo(map)
    .bindPopup({{ location['name'] | tojson }});
    {% endfor %}
    
    </script>
</body>
</html>
